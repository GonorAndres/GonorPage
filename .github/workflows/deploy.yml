name: Deploy to Cloudflare Pages

# Production: every push to `main` builds the site, runs the deploy gate and
# the SEO guard, and uploads dist/ to the Cloudflare Pages project `gonorpage`,
# which serves https://gonor.me. Nothing is published if any step fails.
# See docs/DEPLOYMENT.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}

      - name: SEO guard
        run: node scripts/check-seo-output.mjs dist

      - name: Install Playwright (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Start preview server
        run: npx astro preview --host 0.0.0.0 &

      - name: Wait for server
        run: npx wait-on http://localhost:4321 --timeout 15000

      - name: Run deploy gate tests
        run: npx playwright test --config=playwright.ci.config.ts

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=gonorpage --branch=main --commit-dirty=true

      - name: Smoke test the deployment
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -u
          fail() { echo "::error::$1"; exit 1; }
          # Wait for the new deployment to answer.
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$DEPLOY_URL/") && [ "$code" = 200 ] && break
            sleep 5
          done
          [ "$code" = 200 ] || fail "$DEPLOY_URL/ returned $code"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$DEPLOY_URL/does-not-exist/")
          [ "$code" = 404 ] || fail "unknown path returned $code, expected 404 (SPA fallback means 404.html is missing)"
          curl -sI "$DEPLOY_URL/" | grep -qi '^x-robots-tag: noindex' || fail "pages.dev deployment is not noindexed"
          # gonor.me must never carry a robots header.
          if curl -sI https://gonor.me/ | grep -qi '^x-robots-tag'; then fail "gonor.me sends X-Robots-Tag"; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' https://gonor.me/)
          [ "$code" = 200 ] || fail "https://gonor.me/ returned $code"
          echo "Smoke test passed for $DEPLOY_URL and gonor.me"
